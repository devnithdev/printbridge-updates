<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download PrintBridge</title>
<meta name="description" content="Print from any computer to any printer in the office. Download PrintBridge for Windows or Mac.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<style>
  /* PrintBridge colours (the same as the app: desktop/lib/brand.js) */
  :root {
    --brand: #1E6FBF;
    --brand-dark: #123F73;
    --green: #21A67B;
    --bg: #f5f7fa;
    --card: #ffffff;
    --ink: #1f2933;
    --soft: #5b6775;
    --line: #e3e8ee;
    --brand-text: #1E6FBF;
    --halo: rgba(30, 111, 191, 0.10);
    --gold: #8f7036;          /* the signature's gold, darker so it reads on white */
    --serif: 'Cormorant Garamond', Georgia, serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419;
      --card: #171e26;
      --ink: #e6edf3;
      --soft: #9aa7b4;
      --line: #263241;
      --brand-text: #6aa9ea;
      --halo: rgba(106, 169, 234, 0.14);
      --gold: #d9c08a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419;
    --card: #171e26;
    --ink: #e6edf3;
    --soft: #9aa7b4;
    --line: #263241;
    --brand-text: #6aa9ea;
    --halo: rgba(106, 169, 234, 0.14);
    --gold: #d9c08a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* The light/dark switch, top right */
  .theme {
    position: fixed; top: 16px; right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .theme:hover { border-color: var(--brand-text); }
  .theme:focus-visible { outline: 3px solid var(--halo); outline-offset: 2px; }
  .theme svg { width: 18px; height: 18px; }
  .theme .moon { display: none; }
  :root[data-dark] .theme .sun { display: none; }
  :root[data-dark] .theme .moon { display: block; }

  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 72px 16px 32px;
  }
  .card {
    width: 100%; max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 32px 32px;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  /* The blue/green bar every PrintBridge page has */
  .card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
    background: linear-gradient(90deg, var(--brand) 0 80%, var(--green) 80%);
  }

  .logo {
    width: 96px; height: 96px; margin: 4px auto 18px;
    border-radius: 28px;
    background: var(--halo);
    color: var(--brand-text);
    display: grid; place-items: center;
  }
  .logo .mug { font-size: 52px; line-height: 1; }

  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
  .tagline { color: var(--soft); margin: 0 0 28px; }

  .download {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 12px;
    background: var(--brand); color: #fff;
    font-size: 17px; font-weight: 600; text-decoration: none;
    transition: background .15s, transform .1s;
  }
  .download:hover { background: var(--brand-dark); }
  .download:active { transform: translateY(1px); }
  .download:focus-visible { outline: 3px solid var(--halo); outline-offset: 3px; }
  .download svg { width: 20px; height: 20px; flex: none; }

  .meta { margin: 14px 0 0; font-size: 14px; color: var(--soft); }
  .meta a { color: var(--brand-text); text-decoration: none; font-weight: 600; }
  .meta a:hover { text-decoration: underline; }

  .note {
    margin: 22px 0 0; padding: 12px 14px;
    border-radius: 10px; background: var(--halo);
    font-size: 14px; color: var(--ink); text-align: left;
  }
  .note[hidden] { display: none; }

  footer {
    padding: 0 16px 24px; text-align: center;
    font-size: 13px; color: var(--soft);
  }
  /* The signature: the same coffee mark as clenol.lk and omil.lk. The cup sits
     dimmed; pointing at it (or tapping it) slides in "by @devnithdev". */
  .egg {
    position: relative; display: inline-flex; align-items: center;
    cursor: default; user-select: none; -webkit-user-select: none;
    color: var(--gold); outline: none;
  }
  .egg .cup { font-size: 17px; line-height: 1; opacity: .6; transition: opacity .3s; }
  .egg b {
    position: absolute; left: 100%; top: 50%; margin-left: 12px;
    translate: -10px -50%; opacity: 0; white-space: nowrap; pointer-events: none;
    font: italic 400 1.05rem var(--serif); letter-spacing: .04em; color: var(--gold);
    transition: opacity .6s, translate .6s cubic-bezier(.2,.7,.2,1);
  }
  .egg:hover .cup, .egg:focus-visible .cup, .egg.on .cup { opacity: 1; }
  .egg:hover b, .egg:focus-visible b, .egg.on b { opacity: 1; translate: 0 -50%; }
  .egg:focus-visible { outline: 2px solid var(--halo); outline-offset: 4px; border-radius: 6px; }

  @media (max-width: 420px) {
    .card { padding: 36px 20px 24px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<button class="theme" id="theme" type="button" aria-label="Switch between light and dark">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<main>
  <div class="card">
    <div class="logo" aria-hidden="true"><span class="mug notranslate" translate="no">☕️</span></div>

    <h1>PrintBridge</h1>
    <p class="tagline">Print from any computer to any printer in the office.</p>

    <a class="download" id="download" href="https://github.com/devnithdev/printbridge-updates/releases/latest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span id="label">Download PrintBridge</span>
    </a>

    <p class="meta"><span id="version">Latest version</span><span id="other"></span></p>

    <p class="note" id="phone" hidden>
      PrintBridge is installed on computers. Open this page on the Windows PC or Mac you want to set up.
      To print from this phone, scan the sign on the office wall instead.
    </p>
  </div>
</main>

<footer>
  <span class="egg notranslate" id="egg" tabindex="0" role="note" aria-label="by @devnithdev" translate="no"><span class="cup" aria-hidden="true">☕️</span><b>by @devnithdev</b></span>
</footer>

<script>
(function () {
  // --- light / dark ---------------------------------------------------------
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function saved() { try { return localStorage.getItem("pb-theme"); } catch (e) { return null; } }
  function apply(theme) {
    if (theme) root.setAttribute("data-theme", theme); else root.removeAttribute("data-theme");
    var dark = theme ? theme === "dark" : !!(media && media.matches);
    if (dark) root.setAttribute("data-dark", ""); else root.removeAttribute("data-dark");
  }
  apply(saved());
  if (media && media.addEventListener) media.addEventListener("change", function () { apply(saved()); });
  document.getElementById("theme").addEventListener("click", function () {
    var next = root.hasAttribute("data-dark") ? "light" : "dark";
    try { localStorage.setItem("pb-theme", next); } catch (e) { /* still switches for now */ }
    apply(next);
  });

  // --- the signature: a tap shows "by @devnithdev" for a moment --------------
  var egg = document.getElementById("egg"), eggTimer = null;
  egg.addEventListener("click", function () {
    egg.classList.add("on");
    clearTimeout(eggTimer);
    eggTimer = setTimeout(function () { egg.classList.remove("on"); }, 3200);
  });

  // --- which installer ------------------------------------------------------
  // GitHub's "latest" addresses always point at the newest release, so this
  // page never needs changing when a new version is published.
  var BASE = "https://github.com/devnithdev/printbridge-updates/releases/latest/download/";
  var FILES = {
    windows: { url: BASE + "PrintBridgeSetup.exe", label: "Download for Windows", name: "Windows" },
    mac: { url: BASE + "PrintBridge.pkg", label: "Download for Mac", name: "Mac" }
  };

  var ua = navigator.userAgent || "";
  var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
  var isPhone = /iPhone|iPad|iPod|Android/i.test(ua) || (/Mac/.test(platform) && navigator.maxTouchPoints > 1);
  var system = /Win/i.test(platform + ua) ? "windows" : /Mac/i.test(platform + ua) ? "mac" : null;

  var button = document.getElementById("download");
  var label = document.getElementById("label");
  var other = document.getElementById("other");

  function link(key) {
    var a = document.createElement("a");
    a.href = FILES[key].url;
    a.textContent = FILES[key].name;
    return a;
  }

  if (isPhone) {
    document.getElementById("phone").hidden = false;
    label.textContent = "See all downloads";
    other.append(" · for ", link("windows"), " or ", link("mac"));
  } else if (system) {
    var alt = system === "windows" ? "mac" : "windows";
    button.href = FILES[system].url;
    label.textContent = FILES[system].label;
    other.append(" · also for ", link(alt));
  } else {
    label.textContent = "See all downloads";
    other.append(" · for ", link("windows"), " or ", link("mac"));
  }

  // --- the version number (just for show; the button works without it) -----
  fetch("https://api.github.com/repos/devnithdev/printbridge-updates/releases/latest", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (rel) {
      if (rel && rel.tag_name) document.getElementById("version").textContent = "Version " + rel.tag_name.replace(/^v/, "");
    })
    .catch(function () { /* stays "Latest version" */ });
})();
</script>
</body>
</html>
